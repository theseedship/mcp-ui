name: KaTeX compatibility (Solid 2 tarballs)

on:
  pull_request:
    branches: [feat/solid2-preview]

permissions:
  contents: read

jobs:
  katex-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install source dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Spec and Solid producers
        run: |
          set -euo pipefail
          pnpm --dir mcp-ui-spec build
          pnpm --dir mcp-ui-solid build
      - name: Exercise focused adapter and Markdown tests
        run: pnpm --dir mcp-ui-solid exec vitest run src/plugins/katex.test.ts src/plugins/katex.options.test.ts src/utils/math-markdown.test.ts src/utils/math-markdown.server.test.ts src/components/UIResourceRenderer.math.test.tsx src/context/MCPUIMathContext.test.tsx src/utils/sanitize-html.test.ts src/utils/sanitize-html.server.test.ts src/utils/sanitize-html.ssr.test.ts --maxWorkers=2
      - name: Verify existing Solid type contracts
        run: pnpm --dir mcp-ui-solid typecheck
      - name: Install isolated Chromium tooling
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mcp-ui-katex-browser-tools" --no-package-lock --ignore-scripts playwright@1.63.0
          npm exec --prefix "$RUNNER_TEMP/mcp-ui-katex-browser-tools" -- playwright install --with-deps chromium
      - name: Pack local artifacts, never publish
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-ui-katex-artifacts"
          pnpm --dir mcp-ui-spec pack --pack-destination "$RUNNER_TEMP/mcp-ui-katex-artifacts"
          pnpm --dir mcp-ui-solid pack --pack-destination "$RUNNER_TEMP/mcp-ui-katex-artifacts"
      - name: Qualify exact 0.18.4, 0.18.5 and absent consumers
        env:
          MCP_THEME_BROWSER_DEPS: ${{ runner.temp }}/mcp-ui-katex-browser-tools/node_modules
        run: |
          set -euo pipefail
          for version in 0.18.4 0.18.5 absent; do
            consumer="$RUNNER_TEMP/mcp-ui-katex-$version"
            node mcp-ui-solid/tests/katex/run.mjs prepare \
              --tarball "$RUNNER_TEMP/mcp-ui-katex-artifacts/seed-ship-mcp-ui-solid-8.0.0-solid2.2.tgz" \
              --spec-tarball "$RUNNER_TEMP/mcp-ui-katex-artifacts/seed-ship-mcp-ui-spec-6.0.0.tgz" \
              --consumer "$consumer" --version "$version"
            pnpm --dir "$consumer" install --ignore-scripts
            node mcp-ui-solid/tests/katex/run.mjs probe --consumer "$consumer"
            node mcp-ui-solid/tests/katex/run.mjs run --consumer "$consumer"
          done
      - name: Preserve exact local qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: solid2-katex-compatibility
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/mcp-ui-katex-artifacts/*.tgz
            ${{ runner.temp }}/mcp-ui-katex-*/qualification-input.json
            ${{ runner.temp }}/mcp-ui-katex-*/import-probe-result.json
            ${{ runner.temp }}/mcp-ui-katex-*/pnpm-lock.yaml
            ${{ runner.temp }}/mcp-ui-katex-*/qualification-results/
