name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  preview-channel-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test preview release guards without credentials or network
        run: node --test scripts/solid2-preview/verify.test.mjs mcp-ui-solid/tests/solid2/cohort.node-test.mjs

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # IMPORTANT: pnpm must be installed BEFORE setup-node@v5, otherwise
      # setup-node's auto-detected package-manager-cache feature fails to
      # locate the `pnpm` executable.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test clean-consumer harness safeguards
        run: node --test scripts/finalize-declarations.test.mjs mcp-ui-solid/tests/solid2/cohort.node-test.mjs mcp-ui-solid/tests/solid2/harness.node-test.mjs mcp-ui-solid/tests/solid2/dist-browser.node-test.mjs mcp-ui-solid/tests/solid2/optional-loader.node-test.mjs

      - name: Test
        run: pnpm -r exec vitest run --maxWorkers=4

      # Browser tooling is isolated from the published package and its lockfile.
      - name: Install theme regression tooling
        run: npm install --prefix "$RUNNER_TEMP/mcp-ui-theme-tools" --no-package-lock --ignore-scripts playwright@1.63.0 @tailwindcss/vite@4.3.3 tailwindcss@4.3.3

      - name: Install theme regression browser
        run: npm exec --prefix "$RUNNER_TEMP/mcp-ui-theme-tools" -- playwright install --with-deps chromium

      - name: Check default and host theme colors in Chromium
        env:
          MCP_THEME_BROWSER_DEPS: ${{ runner.temp }}/mcp-ui-theme-tools/node_modules
        run: node mcp-ui-solid/tests/theme/browser.mjs --host

      - name: Create local-only preview package
        working-directory: mcp-ui-solid
        run: |
          mkdir -p "$RUNNER_TEMP/mcpui-solid2-artifacts"
          pnpm pack --pack-destination "$RUNNER_TEMP/mcpui-solid2-artifacts"

      - name: Create patched Spec fixture package
        working-directory: mcp-ui-spec
        run: pnpm pack --pack-destination "$RUNNER_TEMP/mcpui-solid2-artifacts"

      - name: Qualify real tarballs with and without optional engines
        env:
          MCP_THEME_BROWSER_DEPS: ${{ runner.temp }}/mcp-ui-theme-tools/node_modules
        run: |
          for profile in full optional-absent; do
            consumer="$RUNNER_TEMP/mcpui-solid2-$profile"
            node mcp-ui-solid/tests/solid2/run.mjs prepare \
              --tarball "$RUNNER_TEMP/mcpui-solid2-artifacts/seed-ship-mcp-ui-solid-7.0.0-solid2.0.tgz" \
              --spec-tarball "$RUNNER_TEMP/mcpui-solid2-artifacts/seed-ship-mcp-ui-spec-6.0.0.tgz" \
              --consumer "$consumer" --profile "$profile"
            pnpm --dir "$consumer" install --ignore-scripts
            node mcp-ui-solid/tests/solid2/run.mjs probe --consumer "$consumer"
            node mcp-ui-solid/tests/solid2/run.mjs run --consumer "$consumer" --mode both
          done
          node mcp-ui-solid/tests/solid2/dist-browser.mjs --consumer "$RUNNER_TEMP/mcpui-solid2-full"

      - name: Qualify packed CLI resolver
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir mcp-ui-cli pack --pack-destination "$RUNNER_TEMP/mcpui-solid2-artifacts"
          node scripts/fast-uri-security/verify.mjs \
            --spec "$RUNNER_TEMP/mcpui-solid2-artifacts/seed-ship-mcp-ui-spec-6.0.0.tgz" \
            --cli "$RUNNER_TEMP/mcpui-solid2-artifacts/seed-ship-mcp-ui-cli-5.0.2.tgz" \
            --report "$RUNNER_TEMP/mcpui-fast-uri-report.json"

      - name: Retain local-package qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solid2-preview-qualification
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mcpui-solid2-artifacts/*.tgz
            ${{ runner.temp }}/mcpui-solid2-*/qualification-input.json
            ${{ runner.temp }}/mcpui-solid2-*/import-probe-result.json
            ${{ runner.temp }}/mcpui-solid2-*/pnpm-lock.yaml
            ${{ runner.temp }}/mcpui-solid2-*/qualification-results/
            ${{ runner.temp }}/mcpui-solid2-*/dist-client-probe/
            ${{ runner.temp }}/mcpui-fast-uri-report*

  solid1-baseline:
    # Independent runtime and lockfile: never install Solid 2 over the baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dad219a3e637c78f833fcc1d00e16f8c8beec1c0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm -r exec vitest run --maxWorkers=4
