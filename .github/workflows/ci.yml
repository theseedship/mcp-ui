name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  preview-channel-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test preview release guards without credentials or network
        run: node --test scripts/solid2-preview/verify.test.mjs scripts/stable-release/verify.test.mjs

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # IMPORTANT: pnpm must be installed BEFORE setup-node@v5, otherwise
      # setup-node's auto-detected package-manager-cache feature fails to
      # locate the `pnpm` executable.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test declaration graph and release safeguards
        run: node --test scripts/finalize-declarations.test.mjs scripts/solid2-preview/verify.test.mjs scripts/stable-release/verify.test.mjs

      - name: Test
        run: pnpm test

      # Browser tooling is isolated from the published package and its lockfile.
      - name: Install theme regression tooling
        run: npm install --prefix "$RUNNER_TEMP/mcp-ui-theme-tools" --no-package-lock --ignore-scripts playwright@1.63.0 @tailwindcss/vite@4.3.3 tailwindcss@4.3.3

      - name: Install theme regression browser
        run: npm exec --prefix "$RUNNER_TEMP/mcp-ui-theme-tools" -- playwright install --with-deps chromium

      - name: Check default and host theme colors in Chromium
        env:
          MCP_THEME_BROWSER_DEPS: ${{ runner.temp }}/mcp-ui-theme-tools/node_modules
        run: node mcp-ui-solid/tests/theme/browser.mjs --host

      - name: Qualify real stable tarballs under Solid 1
        env:
          MCP_THEME_BROWSER_DEPS: ${{ runner.temp }}/mcp-ui-theme-tools/node_modules
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/mcpui-zod4-artifacts"
          mkdir -p "$artifact_dir"
          for package in mcp-ui-spec mcp-ui-solid mcp-ui-cli; do
            pnpm --dir "$package" pack --pack-destination "$artifact_dir"
          done
          spec_version=$(node -p "require('./mcp-ui-spec/package.json').version")
          solid_version=$(node -p "require('./mcp-ui-solid/package.json').version")
          cli_version=$(node -p "require('./mcp-ui-cli/package.json').version")
          for profile in full optional-absent; do
            node scripts/zod4-stable/verify.mjs \
              --spec "$artifact_dir/seed-ship-mcp-ui-spec-$spec_version.tgz" \
              --solid "$artifact_dir/seed-ship-mcp-ui-solid-$solid_version.tgz" \
              --cli "$artifact_dir/seed-ship-mcp-ui-cli-$cli_version.tgz" \
              --expect-spec "$spec_version" --expect-solid "$solid_version" --expect-cli "$cli_version" \
              --profile "$profile" --browser-deps "$MCP_THEME_BROWSER_DEPS" \
              --report "$RUNNER_TEMP/mcpui-zod4-$profile-report.json"
          done

      - name: Check CLI resolver with an intentionally old Ajv nested dependency
        shell: bash
        run: |
          set -euo pipefail
          spec_version=$(node -p "require('./mcp-ui-spec/package.json').version")
          cli_version=$(node -p "require('./mcp-ui-cli/package.json').version")
          node scripts/fast-uri-security/verify.mjs \
            --spec "$RUNNER_TEMP/mcpui-zod4-artifacts/seed-ship-mcp-ui-spec-$spec_version.tgz" \
            --cli "$RUNNER_TEMP/mcpui-zod4-artifacts/seed-ship-mcp-ui-cli-$cli_version.tgz" \
            --report "$RUNNER_TEMP/mcpui-fast-uri-report.json"

      - name: Retain stable tarball qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zod4-stable-qualification
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mcpui-zod4-artifacts/*.tgz
            ${{ runner.temp }}/mcpui-zod4-*-report*
            ${{ runner.temp }}/mcpui-fast-uri-report*
