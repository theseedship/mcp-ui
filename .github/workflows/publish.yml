name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      check_auth_only:
        description: 'Check npm authentication without building or publishing'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

# Keep pending releases instead of replacing the previous pending run.
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

jobs:
  check-npm-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.check_auth_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout or dependency installation: only authenticate to npm.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check npm authentication
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_auth_only
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # IMPORTANT: pnpm before setup-node@v5 (auto package-manager-cache).
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts

      - name: Stage packages for maintainer approval
        shell: bash
        # Pack with pnpm first to resolve workspace: dependencies.
        # Successful staging is NOT a public release: approval requires 2FA.
        run: |
          set -euo pipefail
          echo '## npm staging (manual approval required)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Approve packages in npmjs.com → Staged Packages, Spec before Solid. Uploads are not public until approved.' >> "$GITHUB_STEP_SUMMARY"
          for dir in mcp-ui-spec mcp-ui-solid mcp-ui-cli; do
            pushd "$dir" > /dev/null
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "✓ Skip $name@$version (already on npm)"
              echo "- $name@$version: already public, skipped." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "→ Staging $name@$version"
              pack_dir=$(mktemp -d)
              pnpm pack --pack-destination "$pack_dir"
              tarballs=("$pack_dir"/*.tgz)
              test "${#tarballs[@]}" -eq 1
              test -f "${tarballs[0]}"
              npm stage publish "${tarballs[0]}" --access public --tag latest
              echo "- $name@$version: staged; approve on npmjs.com with 2FA." >> "$GITHUB_STEP_SUMMARY"
            fi
            popd > /dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
